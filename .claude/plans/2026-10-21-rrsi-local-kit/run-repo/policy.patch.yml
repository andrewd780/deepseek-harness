# Frozen policy for local trials. Every trial runtime applies it after the
# candidate's overlay. It declares the Ollama route; each trial's Harness home
# is fresh, so nothing in your Models page reaches a trial.
- id: llm-pi-ai
  config:
    providers:
      ollama-local:
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_API_KEY
        models:
          - id: YOUR_OLLAMA_MODEL
