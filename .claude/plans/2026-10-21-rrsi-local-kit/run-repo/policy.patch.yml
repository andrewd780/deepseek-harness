# Frozen policy for local trials. Every trial runtime applies it after the
# candidate's overlay. It declares the Ollama route; each trial's Harness home
# is fresh, so nothing in your Models page reaches a trial.
#
# The sandbox stays at workspace-write whatever a candidate does: the trial's
# shell and file tools can write only inside the trial's own workspace and the
# temporary area. Reads and network access are not confined.
- id: sandbox-policy
  config:
    mode: workspace-write

- id: llm-pi-ai
  config:
    providers:
      ollama-local:
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_API_KEY
        models:
          - id: YOUR_OLLAMA_MODEL
