# Keyless proactive compaction under shipped defaults. The route correctly
# declares a 32,768-token window and reserves no output, so the derived
# headroom places the trigger at 26,214 tokens and caps the summary request at
# 6,554 tokens. Each evidence block stays under the shipped tool-result
# pruner's 8,192-character threshold, so summarization, not pruning, relieves
# the pressure. An 8,192-token window cannot show this with the same prompt
# and tool schemas: they price at about 5,600 tokens, so its 1,310-token
# retained tail keeps the compacted request above the 6,553-token trigger.

- id: agent-instructions
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 32768
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'
